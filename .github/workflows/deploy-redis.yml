name: Deploy Redis

# Redis 스택은 앱과 **독립적으로** 배포된다.
# 이 워크플로는 Redis 설정 파일이 바뀔 때만 돈다 — 이미지 빌드도, 앱 재배포도 하지 않는다.
on:
  push:
    branches:
      - main
    paths:
      - 'infra/prod_nerd_cache.yml'
      - '.github/workflows/deploy-redis.yml'
  workflow_dispatch:

# 같은 스택에 동시에 배포가 겹치지 않게 줄을 세운다.
concurrency:
  group: deploy-redis
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: PROD
    steps:
      - uses: actions/checkout@v4

      # 저장소의 파일명이 이미 스택명이다 — scp 가 그대로 올리면 서버 규약
      # (`$DEPLOY_DIR/stacks/<스택명>.yml`)이 성립한다. 이름을 바꾸는 staging 단계가 필요 없다.
      # Redis 만 스택명이 `cache` 인 예외라 파일명도 `prod_nerd_cache.yml` 이다 —
      # named volume 이 스택 이름을 물고 있어 재명명하지 않기로 한 결정이 파일명에도 드러난다
      # (docs/tasks/tasks-stack-rename.md).
      - name: stack YAML 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          source: infra/prod_nerd_cache.yml
          target: ${{ secrets.DEPLOY_DIR }}/stacks
          strip_components: 1

      - name: 스택 배포 (수렴까지 동기 대기)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          envs: OVERLAY_NETWORK,STACK_FILE
          script: |
            set -e
            docker stack deploy --detach=false \
              -c "$STACK_FILE" prod_nerd_cache
            docker stack services prod_nerd_cache
        env:
          OVERLAY_NETWORK: ${{ secrets.OVERLAY_NETWORK }}
          STACK_FILE: ${{ secrets.DEPLOY_DIR }}/stacks/prod_nerd_cache.yml

      # ⚠️ Redis 는 named volume 때문에 stop-first 로 교체된다.
      #    즉 재시작 순간 짧은 공백이 있다. 앱은 그 동안 레이트리밋만 축소 모드로 돌아간다
      #    (fail-open) — HTTP 는 계속 응답한다.
      #
      #    overlay attachable 여부에 의존하지 않도록 떠 있는 태스크 안에서 확인한다.
      - name: 스모크 테스트 (PING)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          script: |
            set -e
            for i in $(seq 1 20); do
              cid=$(docker ps -q \
                --filter "label=com.docker.stack.namespace=prod_nerd_cache" | head -1)
              if [ -n "$cid" ] && docker exec "$cid" redis-cli ping 2>/dev/null | grep -q PONG; then
                echo "PONG 확인 (시도 $i)"
                exit 0
              fi
              sleep 3
            done
            echo "PING 실패 — 배포를 실패로 처리한다"
            docker service ps prod_nerd_cache_redis --no-trunc
            exit 1
