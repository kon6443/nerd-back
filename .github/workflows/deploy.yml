name: Deploy

on:
  push:
    branches:
      - main
    # paths 는 화이트리스트로 지정한다.
    # paths-ignore 는 머지 커밋 평가에서 의도 외 트리거가 발생한다.
    paths:
      - 'app/**'
      - 'public/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - 'eslint.config.mjs'
      # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박힌다 — 바뀌면 반드시 재빌드해야 한다.
      - '.env.production'
      - 'infra/docker-stack.app.yml'
      - '.github/workflows/deploy.yml'
  # 코드 변경 없이 현재 main 을 다시 배포할 때 쓴다.
  workflow_dispatch:

# 배포가 겹치면 Swarm 수렴 중에 다음 배포가 끼어든다. 앞선 실행을 취소하지 않고 줄을 세운다.
concurrency:
  group: deploy-front-prod
  cancel-in-progress: false

jobs:
  # 검증을 배포와 분리한 job 으로 둔다. 실패하면 build 가 시작조차 하지 않는다.
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:all

  deploy:
    needs: verify
    runs-on: ubuntu-24.04-arm
    environment: PROD
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 태그 계산 (커밋 short SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 러너가 이미 arm64 라 QEMU 가 필요 없다.
      - uses: docker/setup-buildx-action@v3

      - name: 레지스트리 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/prod_nerd_front:${{ steps.meta.outputs.tag }}
          # next.config.ts 의 deploymentId 로 들어간다. 롤링 중 version skew 를 막는다.
          # 이미지 태그와 **같은 값**이어야 어떤 배포인지 특정된다.
          build-args: |
            DEPLOYMENT_VERSION=${{ steps.meta.outputs.tag }}
          # Swarm 의 매니페스트 처리가 attestation 을 삼키지 못한다.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: stack YAML 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          source: infra/docker-stack.app.yml
          target: ${{ secrets.DEPLOY_STACK_DIR }}
          strip_components: 1

      - name: 스택 배포 (수렴까지 동기 대기)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          envs: REGISTRY_URL,IMAGE_TAG,OVERLAY_NETWORK,ENV_FILE_PATH,STACK_DIR
          script: |
            set -e
            docker stack deploy --detach=false --with-registry-auth \
              -c "$STACK_DIR/docker-stack.app.yml" prod_nerd_front
            docker stack services prod_nerd_front
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          OVERLAY_NETWORK: ${{ secrets.OVERLAY_NETWORK }}
          ENV_FILE_PATH: ${{ secrets.ENV_FILE_PATH }}
          STACK_DIR: ${{ secrets.DEPLOY_STACK_DIR }}

      # 수렴 명령이 성공해도 앱이 실제로 응답하는지는 별개다.
      # 여기까지 통과해야 배포가 끝난 것으로 본다.
      #
      # ⚠️ 컨테이너를 **스택 네임스페이스 라벨**로 고른다. `--filter name=` 은 부분 문자열
      #    매칭이라 이름이 겹치는 다른 스택의 컨테이너까지 잡을 수 있고, head -1 이 그걸
      #    집으면 실패한 배포가 통과로 보고된다 (백엔드에서 실제로 겪은 함정).
      #
      # ⚠️ `docker run --network <overlay>` 를 쓰지 않는다. Swarm overlay 는 기본적으로
      #    attachable 이 아니어서 임시 컨테이너를 붙일 수 없다.
      - name: 스모크 테스트 (liveness 폴링)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          script: |
            set -e
            # start_period 60s 를 감안해 넉넉히 잡는다 (3s × 40 = 120s).
            for i in $(seq 1 40); do
              cid=$(docker ps -q \
                --filter "label=com.docker.stack.namespace=prod_nerd_front" | head -1)
              if [ -n "$cid" ] && docker exec "$cid" node scripts/healthcheck.mjs; then
                echo "liveness 200 확인 (시도 $i)"
                exit 0
              fi
              sleep 3
            done
            echo "liveness 확인 실패 — 배포를 실패로 처리한다"
            docker service ps prod_nerd_front_app --no-trunc
            docker service logs --tail 50 prod_nerd_front_app || true
            exit 1
