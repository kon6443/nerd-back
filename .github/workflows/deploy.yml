name: Deploy

on:
  push:
    branches:
      - main
    # paths 는 화이트리스트로 지정한다.
    # paths-ignore 는 머지 커밋 평가에서 의도 외 트리거가 발생한다.
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'jest.config.js'
      - 'infra/docker-stack.app.yml'
      - '.github/workflows/deploy.yml'

# 배포가 겹치면 Swarm 수렴 중에 다음 배포가 끼어든다. 앞선 실행을 취소하지 않고 줄을 세운다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # 검증을 배포와 분리한 job 으로 둔다. 실패하면 build 가 시작조차 하지 않는다.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:all

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 태그 계산 (커밋 short SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 레지스트리 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          # 배포 노드가 ARM64 단일이므로 amd64 는 빌드하지 않는다.
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/prod_nerd_back:${{ steps.meta.outputs.tag }}
          # Swarm 의 매니페스트 처리가 attestation 을 삼키지 못한다.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: stack YAML 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: infra/docker-stack.app.yml
          target: ${{ secrets.DEPLOY_STACK_DIR }}
          strip_components: 1

      - name: 스택 배포 (수렴까지 동기 대기)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REGISTRY_URL,IMAGE_TAG,OVERLAY_NETWORK,ENV_FILE_PATH,STACK_DIR
          script: |
            set -e
            docker stack deploy --detach=false --with-registry-auth \
              -c "$STACK_DIR/docker-stack.app.yml" prod_nerd_back
            docker stack services prod_nerd_back
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          OVERLAY_NETWORK: ${{ secrets.OVERLAY_NETWORK }}
          ENV_FILE_PATH: ${{ secrets.ENV_FILE_PATH }}
          STACK_DIR: ${{ secrets.DEPLOY_STACK_DIR }}

      # 수렴 명령이 성공해도 앱이 실제로 응답하는지는 별개다.
      # 여기까지 통과해야 배포가 끝난 것으로 본다.
      - name: 스모크 테스트 (liveness 폴링)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            for i in $(seq 1 20); do
              if docker run --rm --network "${{ secrets.OVERLAY_NETWORK }}" \
                   curlimages/curl:latest -fsS \
                   "http://tasks.prod_nerd_back:5501/api/v1/health" > /dev/null 2>&1; then
                echo "liveness 200 확인 (시도 $i)"
                exit 0
              fi
              sleep 3
            done
            echo "liveness 확인 실패 — 배포를 실패로 처리한다"
            docker service ps prod_nerd_back_app --no-trunc
            exit 1
