name: Deploy

on:
  push:
    branches:
      - main
    # paths 는 화이트리스트로 지정한다.
    # paths-ignore 는 머지 커밋 평가에서 의도 외 트리거가 발생한다.
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'jest.config.js'
      - 'infra/docker-stack.app.yml'
      - '.github/workflows/deploy.yml'
  # 코드 변경 없이 현재 main 을 다시 배포할 때 쓴다.
  workflow_dispatch:

# 배포가 겹치면 Swarm 수렴 중에 다음 배포가 끼어든다. 앞선 실행을 취소하지 않고 줄을 세운다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # 검증을 배포와 분리한 job 으로 둔다. 실패하면 build 가 시작조차 하지 않는다.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:all

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 태그 계산 (커밋 short SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 레지스트리 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          # 배포 노드가 ARM64 단일이므로 amd64 는 빌드하지 않는다.
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/prod_nerd_back:${{ steps.meta.outputs.tag }}
          # Swarm 의 매니페스트 처리가 attestation 을 삼키지 못한다.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: stack YAML 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          source: infra/docker-stack.app.yml
          target: ${{ secrets.DEPLOY_STACK_DIR }}
          strip_components: 1

      - name: 스택 배포 (수렴까지 동기 대기)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          envs: REGISTRY_URL,IMAGE_TAG,OVERLAY_NETWORK,ENV_FILE_PATH,STACK_DIR
          script: |
            set -e
            docker stack deploy --detach=false --with-registry-auth \
              -c "$STACK_DIR/docker-stack.app.yml" prod_nerd_back
            docker stack services prod_nerd_back
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          OVERLAY_NETWORK: ${{ secrets.OVERLAY_NETWORK }}
          ENV_FILE_PATH: ${{ secrets.ENV_FILE_PATH }}
          STACK_DIR: ${{ secrets.DEPLOY_STACK_DIR }}

      # 수렴 명령이 성공해도 앱이 실제로 응답하는지는 별개다.
      # 여기까지 통과해야 배포가 끝난 것으로 본다.
      #
      # ⚠️ `docker run --network <overlay>` 를 쓰지 않는다. Swarm overlay 는 기본적으로
      #    attachable 이 아니어서 임시 컨테이너를 붙일 수 없다(생성 시 --attachable 필요).
      #    이미 떠 있는 태스크 안에서 확인하면 네트워크 설정에 의존하지 않는다.
      - name: 스모크 테스트 (liveness 폴링)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          script: |
            set -e
            # ⚠️ 필터는 반드시 최종 서비스 DNS 이름(prod_nerd_back_app)이어야 한다.
            #    docker ps 의 name 필터는 부분 문자열 매칭이라 `prod_nerd_back` 으로 두면
            #    구 스택(prod_nerd)의 컨테이너 prod_nerd_back.N.xxx 까지 매칭된다.
            #    head -1 이 그걸 집으면 새 배포가 실패해도 스모크가 통과해 버린다.
            for i in $(seq 1 20); do
              cid=$(docker ps -q --filter "name=prod_nerd_back_app" | head -1)
              if [ -n "$cid" ] && docker exec "$cid" node scripts/healthcheck.mjs; then
                echo "liveness 200 확인 (시도 $i)"
                exit 0
              fi
              sleep 3
            done
            echo "liveness 확인 실패 — 배포를 실패로 처리한다"
            docker service ps prod_nerd_back_app --no-trunc
            docker service logs --tail 50 prod_nerd_back_app || true
            exit 1
