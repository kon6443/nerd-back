name: CI (front)

# apps/front 의 검증. 백엔드와 별도로 돈다.
# paths 를 넓게 잡는 이유는 ci-back.yml 상단 주석 참조.
on:
  pull_request:
    paths:
      - 'apps/front/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-front.yml'
  push:
    branches-ignore:
      - main
    paths:
      - 'apps/front/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-front.yml'

jobs:
  verify:
    # 네이티브 arm64 러너. 저장소가 public 이라 무료다.
    # 🚫 private 으로 바꾸면 이 라벨은 실패한다 — ubuntu-latest + QEMU 로 되돌려야 한다.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile

      # lint → 타입 검사 → 스텁 검사 → 헬스체크 경로 검사 → 빌드
      - run: pnpm --filter nerd-front run ci:all

      # 러너가 이미 arm64 라 QEMU(setup-qemu-action)가 필요 없다.
      - uses: docker/setup-buildx-action@v3

      - name: ARM64 이미지 빌드 검증
        uses: docker/build-push-action@v6
        with:
          context: apps/front
          file: apps/front/Dockerfile
          platforms: linux/arm64
          push: false
          provenance: false
          sbom: false
          build-args: |
            DEPLOYMENT_VERSION=ci
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front
