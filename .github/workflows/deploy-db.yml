name: Deploy DB

# MySQL 스택은 앱·Redis 와 **독립적으로** 배포된다.
# 이 파일의 paths 는 나머지 배포 워크플로 3개(back·front·redis)와 교집합이 0건이어야 한다 — 겹치면 한 커밋에 두 스택이 뜬다.
on:
  push:
    branches:
      - main
    paths:
      - 'infra/prod_nerd_db.yml'
      - 'infra/mysql/**'
      - '.github/workflows/deploy-db.yml'
  workflow_dispatch:

# 같은 스택에 동시에 배포가 겹치지 않게 줄을 세운다.
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: PROD
    steps:
      - uses: actions/checkout@v4

      # 저장소의 파일명이 이미 스택명이다 — scp 가 그대로 올리면 서버 규약
      # (`$DEPLOY_DIR/stacks/<스택명>.yml`)이 성립한다.
      #
      # ⚠️ `mysql/` 하위 구조를 유지해야 한다. YAML 의
      #    `configs.init-users-v1.file: ./mysql/init-users.sh` 는 **YAML 파일이 있는
      #    디렉터리 기준**이므로, 저장소에서도(`infra/`) 서버에서도(`stacks/`)
      #    YAML 옆에 `mysql/init-users.sh` 가 있어야 stack deploy 가 파일을 찾는다.
      #    `strip_components: 1` 이 `infra/` 만 벗기므로 그 구조가 그대로 간다.
      - name: stack YAML · initdb 스크립트 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          source: infra/prod_nerd_db.yml,infra/mysql/init-users.sh
          target: ${{ secrets.DEPLOY_DIR }}/stacks
          strip_components: 1

      # stack deploy 는 아래 셋이 없어도 "성공"한다 — 태스크가 pending 에 걸리거나 볼륨 마운트가 실패한 채로.
      # 배포 전에 시끄럽게 막는다.
      # ⚠️ 데이터 경로 검사는 **매니저 == DB 노드** 전제다. 클러스터는 이미 노드 3개이고(2026-09-03 확인),
      #    이 전제는 `prod_nerd_db=1` 라벨이 매니저에만 붙어 있어서 성립한다 — 구조적 보장이 아니다.
      #    라벨을 다른 노드에 붙이면 이 검사와 아래 스모크가 **대상 노드를 못 보게** 된다 (docs/deploy.md).
      - name: 사전 점검 (노드 라벨 · Swarm secret · 데이터 경로)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          envs: MYSQL_DATA_DIR
          script: |
            set -e
            docker node ls -q | xargs docker node inspect --format '{{.Spec.Labels}}' | grep -q 'prod_nerd_db:1' \
              || { echo "노드 라벨 prod_nerd_db=1 이 어느 노드에도 없다"; exit 1; }
            for s in prod_nerd_db_root_pw prod_nerd_db_app_pw prod_nerd_db_migrator_pw; do
              docker secret inspect "$s" >/dev/null 2>&1 || { echo "Swarm secret $s 가 없다"; exit 1; }
            done
            [ -n "$MYSQL_DATA_DIR" ] || { echo "MYSQL_DATA_DIR 시크릿이 비어 있다"; exit 1; }
            [ -d "$MYSQL_DATA_DIR" ] || { echo "MYSQL_DATA_DIR 경로가 없다 — 블록 볼륨이 마운트돼 있나?"; exit 1; }
            echo "사전 점검 통과"
        env:
          MYSQL_DATA_DIR: ${{ secrets.MYSQL_DATA_DIR }}

      # --detach=false 는 태스크가 healthy 가 될 때까지 기다린다. 첫 배포는 데이터 디렉터리 초기화가 포함돼 길다.
      - name: 스택 배포 (수렴까지 동기 대기)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          envs: OVERLAY_NETWORK,MYSQL_DATA_DIR,STACK_FILE
          script: |
            set -e
            docker stack deploy --detach=false \
              -c "$STACK_FILE" prod_nerd_db
            docker stack services prod_nerd_db
        env:
          OVERLAY_NETWORK: ${{ secrets.OVERLAY_NETWORK }}
          MYSQL_DATA_DIR: ${{ secrets.MYSQL_DATA_DIR }}
          STACK_FILE: ${{ secrets.DEPLOY_DIR }}/stacks/prod_nerd_db.yml

      # 설정 파일이 맞다는 것과 서버가 그 값으로 떠 있다는 것은 다른 사실이다. SQL 로 실측한다.
      # 비밀번호를 인자·로그에 노출하지 않는다 — 컨테이너 안에서 secret 파일을 읽어 defaults-extra-file 로 넘긴다.
      - name: 스모크 테스트 (문자셋 · 타임존 · 테이블명 규칙 실측)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          script: |
            set -e
            cid=""
            for i in $(seq 1 40); do
              cid=$(docker ps -q \
                --filter "label=com.docker.stack.namespace=prod_nerd_db" \
                --filter "health=healthy" | head -1)
              [ -n "$cid" ] && break
              sleep 5
            done
            if [ -z "$cid" ]; then
              echo "healthy 컨테이너를 찾지 못했다 — 배포를 실패로 처리한다"
              docker service ps prod_nerd_db_mysql --no-trunc
              exit 1
            fi
            out=$(docker exec "$cid" bash -c '
              mysql --defaults-extra-file=<(printf "[client]\nuser=root\npassword=%s\n" "$(< /run/secrets/prod_nerd_db_root_pw)") \
                -N -B -e "SELECT @@character_set_server, @@collation_server, @@global.time_zone, @@lower_case_table_names"')
            echo "실측: $out"
            expected=$(printf 'utf8mb4\tutf8mb4_0900_ai_ci\t+00:00\t1')
            [ "$out" = "$expected" ] || { echo "설정이 기대와 다르다 (기대: utf8mb4 / utf8mb4_0900_ai_ci / +00:00 / 1)"; exit 1; }
            echo "스모크 테스트 통과"
