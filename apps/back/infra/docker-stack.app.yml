# 앱 스택. Redis(`docker-stack.redis.yml`)와 **독립된 스택**이다.
#
#   docker stack deploy -c docker-stack.app.yml prod_nerd_back
#
# 서비스 DNS 는 `<스택>_<서비스>` 다. 스택 `prod_nerd_back` + 서비스 `app`
# → **`prod_nerd_back_app`**. 리버스 프록시가 tasks.prod_nerd_back_app:5501 로 접근한다.
#
# 스택 이름을 노드 라벨 키(`prod_nerd_back`)와 **일치**시켰다. 어느 스택이 어느 라벨을
# 보는지 파일을 열지 않고도 알 수 있다. 이미지 이름은 스택과 별개 네임스페이스라
# `prod_nerd_back` 을 그대로 쓴다 — 바꾸면 기존 태그 이력이 단절된다.

services:
  app:
    image: ${REGISTRY_URL}/prod_nerd_back:${IMAGE_TAG}

    # 기존 overlay 네트워크에 참여한다. 리버스 프록시가 같은 망에서
    # tasks.prod_nerd_back_app:5501 로 접근하므로 호스트 포트를 publish 하지 않는다.
    # publish 하면 도메인을 우회한 직접 접근 경로가 열리고 포트 충돌 위험이 생긴다.
    networks:
      - shared

    # 시크릿은 저장소에 두지 않고 서버상의 경로에서 주입한다.
    env_file:
      - ${ENV_FILE_PATH}

    environment:
      # 여러 레플리카 중 하나만 실행해야 하는 작업의 가드로 쓴다.
      TASK_SLOT: '{{.Task.Slot}}'

    # SIGTERM 후 진행 중인 요청이 끝날 시간을 준다. Swarm 기본은 10s 라
    # `enableShutdownHooks()` 가 마무리하기 전에 강제 종료될 수 있다.
    stop_grace_period: 30s

    # ⚠️ liveness 경로만 찌른다 (scripts/healthcheck.mjs).
    #    외부 의존을 검사하는 readiness 를 여기에 넣으면 Redis·DB 장애가 컨테이너를
    #    unhealthy 로 만들어 재시작 루프에 빠지고, 아래 failure_action 이 배포를 롤백한다.
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck.mjs']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      # 단일 노드에서도 3개를 두는 이유는 롤링 업데이트로 무중단 배포를 확보하기 위해서다.
      replicas: 3

      # 배포 노드를 고정한다. 볼륨이 없어 기술적으로는 어디서든 돌지만,
      # 배포 워크플로의 스모크 테스트가 **매니저 노드에서** docker ps 로 컨테이너를 찾는다.
      # 다른 노드로 스케줄되면 컨테이너를 못 찾아 스모크 테스트가 실패한다.
      placement:
        constraints:
          - node.labels.prod_nerd_back == 1

      resources:
        limits:
          memory: 640M
        reservations:
          memory: 192M

      update_config:
        # 새 태스크를 먼저 띄우고 healthy 를 확인한 뒤 옛 태스크를 내린다.
        order: start-first
        parallelism: 1
        delay: 5s
        # ⚠️ **start_period(30s)보다 길어야 한다.** 짧으면 새 태스크가 healthy 로
        #    판정되기 전에 다음 레플리카 교체로 넘어가, start-first 로 확보하려던
        #    무중단 보장이 실제로는 깨진다. 이전 값 20s 는 이 조건을 어기고 있었고,
        #    앱 기동이 30s 안에 끝나 우연히 문제가 드러나지 않았을 뿐이다.
        monitor: 45s
        # 하나라도 실패하면 즉시 되돌린다.
        failure_action: rollback
        max_failure_ratio: 0

      rollback_config:
        order: start-first
        parallelism: 1
        monitor: 10s
        failure_action: pause

      # D8 (docs/tasks/tasks-db-mysql.md): DB 는 핵심 의존이라 DB 없이는 부팅에 실패한다.
      # 여기서 포기(max_attempts)하면 노드 재부팅 시 MySQL(초기 복구 20~40초)보다 앱이 먼저 떠서
      # 몇 번 실패한 뒤 **영구 정지**한다 — 사람이 손대기 전까지 서비스가 안 돌아온다.
      # 제한 없이 재시도해 DB 가 돌아오면 앱이 스스로 복구되게 한다. 배포 중 실패는
      # update_config.failure_action 이 따로 맡으므로 여기 정책과 겹치지 않는다.
      restart_policy:
        condition: on-failure
        delay: 10s

networks:
  shared:
    external: true
    # 실제 네트워크 이름은 배포 시점에 환경변수로 주입한다.
    # 저장소에 인프라 식별 정보를 남기지 않는다.
    name: ${OVERLAY_NETWORK}
