name: CI

on:
  pull_request:
  push:
    branches-ignore:
      # main 푸시는 deploy 워크플로가 같은 검증을 먼저 돌리므로 중복 실행하지 않는다.
      - main

jobs:
  verify:
    # 네이티브 arm64 러너. 저장소가 public 이라 무료다.
    # 🚫 private 으로 바꾸면 이 라벨은 실패한다 — ubuntu-latest + QEMU 로 되돌려야 한다.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # lint → 타입 검사 → 스텁 검사 → 헬스체크 경로 검사 → 빌드
      - run: pnpm run ci:all

      # 컨테이너 빌드는 로컬 빌드가 **못 잡는 종류**를 잡는다.
      # 로컬 빌드의 입력은 레포 전체지만 컨테이너 빌드의 입력은 Dockerfile 의
      # COPY 목록뿐이다. 두 입력 집합이 달라 로컬 통과가 컨테이너 통과를 보증하지 않는다.
      #
      # 러너가 이미 arm64 라 QEMU(setup-qemu-action)가 필요 없다.
      - uses: docker/setup-buildx-action@v3

      - name: ARM64 이미지 빌드 검증
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          # Swarm 의 매니페스트 처리가 attestation 을 삼키지 못한다.
          provenance: false
          sbom: false
          build-args: |
            DEPLOYMENT_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
