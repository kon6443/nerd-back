packages:
  - apps/*
  - packages/*

# 패키지별 lockfile — 한 앱의 의존성 변경이 다른 앱의 배포를 트리거하지 않는다
# (docs/tasks/tasks-monorepo.md D2).
#
# ⚠️ 2026-09-04 재검토. 원래 근거 중 "각 앱이 자급자족해야 Dockerfile 컨텍스트를 apps/<x> 로
#    좁힐 수 있다" 는 packages/contracts 도입으로 **소멸했다** — 공유 패키지가 컨텍스트 밖이라
#    빌드 컨텍스트를 레포 루트로 올려야 한다 (docs/tasks/tasks-my-story.md 0-C).
#    남은 근거(배포 트리거 격리)만으로 이 설정을 유지한다.
sharedWorkspaceLockfile: false

# 프론트(Next.js)의 sharp · unrs-resolver 는 prebuilt 를 쓰므로 postinstall 이 필요 없다.
# 워크스페이스에서는 루트 설정만 읽힌다 (원래 apps/front/pnpm-workspace.yaml 에 있던 값).
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
