# 이 프로젝트 전용 Redis. **앱과 독립된 스택**이다.
#
#   docker stack deploy -c docker-stack.redis.yml prod_nerd_cache
#
# 스택을 분리하는 이유는 **배포 수명주기를 끊기 위해서**다.
# 같은 스택에 두면 Redis 설정만 바꿔도 커밋 SHA 가 바뀌어 앱 이미지 태그가 달라지고,
# 결과적으로 앱까지 재배포된다. 분리하면 각자 바뀐 것만 배포된다.
#
# 서비스 DNS = `<스택>_<서비스>` → **`prod_nerd_cache_redis`**
# 앱은 REDIS_HOST 로 이 이름을 받는다 (서버 .env).
#
# ⚠️ **이 스택만 이름 규칙의 예외다.**
#    다른 스택은 「스택 이름 = 노드 라벨 키」이고 서비스 키가 `app` 이다
#    (prod_nerd_back + app → prod_nerd_back_app · prod_nerd_front + app → prod_nerd_front_app).
#    여기만 스택 `prod_nerd_cache` / 라벨 `prod_nerd_redis` 로 어긋나 있다.
#
#    **일관성을 이유로 스택 이름을 바꾸지 말 것.** 아래 named volume 은 Swarm 에서
#    `<스택명>_redis-data` 로 만들어진다. 스택 이름을 바꾸면 새 빈 볼륨이 생기고
#    기존 AOF 데이터에 닿지 않는다 — 옛 볼륨은 고아로 남는다.

services:
  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 128mb
      # volatile-lru: TTL 이 있는 키만 evict 대상이다.
      # allkeys-lru 로 두면 메모리 압박 시 TTL 없는 키(예: 누적 카운터)까지 날아간다.
      # 현재 모든 키에 TTL 이 있지만, 나중에 TTL 없는 키를 추가했을 때
      # 조용히 사라지는 사고를 막기 위해 이쪽을 고른다.
      - --maxmemory-policy
      - volatile-lru

    volumes:
      - redis-data:/data

    networks:
      - shared

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

    deploy:
      replicas: 1

      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M

      update_config:
        parallelism: 1
        # ⚠️ start-first 를 쓰지 않는다. named volume 은 동시에 두 컨테이너가 붙을 수 없다.
        #    앱은 start-first(무중단)지만 Redis 는 stop-first 여야 한다.
        order: stop-first

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s

      # ⚠️ named volume 은 **노드 로컬**이다. 재배치되면 빈 볼륨을 새로 만들어
      #    데이터가 초기화된다. 참고 프로젝트에서 실제로 발생한 사고이며,
      #    `node.role == manager` 만으로는 여러 노드가 허용되어 막히지 않았다.
      #    그래서 노드가 하나뿐인 지금부터 라벨로 못박는다 — 나중에 노드가 늘어난
      #    뒤에 붙이면 이미 데이터가 옮겨간 상태일 수 있다.
      placement:
        constraints:
          - node.labels.prod_nerd_redis == 1

volumes:
  redis-data:

networks:
  shared:
    external: true
    name: ${OVERLAY_NETWORK}
